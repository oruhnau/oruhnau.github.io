name: Render CV
# Builds assets/pdf/Oliver_Ruhnau_CV.pdf from _data/cv.yml + _bibliography/papers.bib
# (see bin/build_cv.py), commits the PDF, and redeploys the site so it serves the new PDF.
on:
  push:
    branches:
      - main
      - master
    paths:
      - "_data/cv.yml"
      - "_bibliography/papers.bib"
      - "assets/rendercv/**"
      - "bin/build_cv.py"
      - "requirements.txt"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  rendercv:
    name: RenderCV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RenderCV
        run: pip install -r requirements.txt
      - name: Build CV PDF
        run: python bin/build_cv.py
      - name: Commit the PDF and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add assets/pdf/Oliver_Ruhnau_CV.pdf
          if git diff --cached --quiet; then
            echo "CV PDF unchanged."
            exit 0
          fi
          git commit -m "chore: render the latest CV"
          git push
          # Pushes made with the workflow token do not trigger other workflows,
          # so start the site deployment explicitly.
          gh workflow run deploy.yml --ref "${{ github.ref_name }}"
