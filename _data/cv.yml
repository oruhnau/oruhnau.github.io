    Short bio:
      - "I am an Assistant Professor of Energy Market Design at the University of Cologne, a Senior Scientist at the affiliated Institute of Energy Economics (EWI), and the Founder and Director of the consultancy tournesol energy. As an energy economist, I study current trends in energy markets—including renewable energy, battery storage, electrification, and demand flexibility—and how market design can shape these trends for society's benefit. I use analytical and numerical models for energy systems and markets, and empirical methods for causal inference. Previously, I was a doctoral and postdoctoral researcher at the Hertie School in Berlin."

